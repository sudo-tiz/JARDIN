########################################################################
#                                                                      #
# jellyfin                                                             #
#                                                                      #
########################################################################
jellyfin_enabled: true
jellyfin_uid: "0"
jellyfin_gid: "0"
jellyfin_hostname: "{{ jellyfin_hostname_label }}.{{ my_domain }}"
# Optional custom Traefik rules can reference jellyfin_hostname.
jellyfin_container_additional_volumes:
  - type: bind
    src: /mnt/media
    dst: /media

# No basic auth
jellyfin_container_labels_traefik_middleware_basic_auth_enabled: false

# Hardware acceleration
jellyfin_gpu_path: "/dev/dri"
jellyfin_gpu_bind_path: "{{ jellyfin_gpu_path }}"

########################################################################
#                                                                      #
# seerr                                                                #
#                                                                      #
########################################################################
seerr_enabled: true
seerr_hostname: "{{ seerr_hostname_label }}.{{ my_domain }}"
seerr_container_additional_networks_custom:
 - "{{ exim_relay_container_network }}"

########################################################################
#                                                                      #
# jackett                                                              #
#                                                                      #
########################################################################
jackett_enabled: true
jackett_container_http_host_bind_port: 127.0.0.1:8081
jackett_hostname: "{{ jackett_hostname_label }}"
jackett_container_labels_traefik_enabled: false

########################################################################
#                                                                      #
# Flaresolverr                                                         #
#                                                                      #
########################################################################
flaresolverr_enabled: true
flaresolverr_container_labels_traefik_enabled: false

########################################################################
#                                                                      #
# sonarr                                                               #
#                                                                      #
########################################################################
sonarr_enabled: true
# sonarr_container_http_bind_port: 127.0.0.1:8082
# sonarr_container_labels_traefik_enabled: false
sonarr_hostname: "{{ sonarr_hostname_label }}.{{ my_domain }}"
sonarr_container_additional_volumes:
  - type: bind
    src: /mnt/media/serie
    dst: /series
  - type: bind
    src: "{{ qbittorrent_base_path }}/downloads"
    dst: /downloads

########################################################################
#                                                                      #
# radarr                                                               #
#                                                                      #
########################################################################
radarr_enabled: true
# radarr_container_http_bind_port: 127.0.0.1:8083
# radarr_container_labels_traefik_enabled: false
radarr_hostname: "{{ radarr_hostname_label }}.{{ my_domain }}"
radarr_container_additional_volumes:
  - type: bind
    src: /mnt/media/film
    dst: /movies
  - type: bind
    src: "{{ qbittorrent_base_path }}/downloads"
    dst: /downloads

########################################################################
#                                                                      #
# bazarr                                                               #
#                                                                      #
########################################################################
bazarr_enabled: true
bazarr_hostname: "{{ bazarr_hostname_label }}"
bazarr_container_http_host_bind_port: 127.0.0.1:8087 # to change
bazarr_container_labels_traefik_enabled: false
bazarr_container_additional_volumes_custom:
  - type: bind
    src: /mnt/media/film
    dst: /movies
  - type: bind
    src: /mnt/media/serie
    dst: /series

bazarr_container_additional_networks_custom:
  - "{{ radarr_container_network }}"
  - "{{ sonarr_container_network }}"


########################################################################
#                                                                      #
# lidaar                                                               #
#                                                                      #
########################################################################
lidarr_enabled: false
lidarr_hostname: "{{ lidarr_hostname_label }}.{{ my_domain }}"
# lidarr_container_http_host_bind_port: 127.0.0.1:8087
# lidarr_container_labels_traefik_enabled: false
lidarr_container_additional_volumes_custom:
  - type: bind
    src: "{{ lidarr_music_path_private }}"
    dst: /musiques
  - type: bind
    src: "{{ qbittorrent_base_path }}/downloads"
    dst: /downloads


########################################################################
#                                                                      #
# qbittorrent                                                          #
#                                                                      #
########################################################################

qbittorrent_enabled: true
qbittorrent_container_http_host_bind_port: 127.0.0.1:8085
qbittorrent_hostname: "{{ qbittorrent_hostname_label }}"
qbittorrent_container_labels_traefik_enabled: false
qbittorrent_download_path: "{{ qbittorrent_base_path }}/downloads"
qbittorrent_container_additional_volumes:
  - type: bind
    src: /mnt/media/film
    dst: /media
